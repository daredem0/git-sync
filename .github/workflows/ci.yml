name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build (debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify tag/version consistency
        run: ./scripts/verify-tag-version.sh

      - name: Build debug binary
        run: cargo build --locked

      - name: Upload debug binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-debug
          path: target/debug/git-sync
          if-no-files-found: error

  build-release:
    name: Build (release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install manpage prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Verify tag/version consistency
        run: ./scripts/verify-tag-version.sh

      - name: Build release binary and manpages
        run: |
          ./scripts/generate-manpages.sh
          if TAG="$(git describe --tags --exact-match HEAD 2>/dev/null)"; then
            VERSION="${TAG#v}"
            echo "Building tagged release with version override: ${VERSION}"
            GIT_SYNC_VERSION_OVERRIDE="${VERSION}" cargo build --locked --release
          else
            cargo build --locked --release
          fi

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-release
          path: target/release/git-sync
          if-no-files-found: error

      - name: Upload release package inputs
        uses: actions/upload-artifact@v4
        with:
          name: release-package-inputs
          path: |
            target/release/git-sync
            target/man/git-sync.1.gz
            target/man/git-sync-readme.7.gz
            target/man/git-sync-architecture.7.gz
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --all-targets

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain with llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run coverage
        run: |
          mkdir -p target/coverage
          cargo llvm-cov --workspace --all-features --lcov --output-path target/coverage/lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info

  package-crate:
    name: Package Crate (.crate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify tag/version consistency
        run: ./scripts/verify-tag-version.sh

      - name: Build crate package
        run: cargo package --locked

      - name: Upload crate package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-crate
          path: target/package/*.crate
          if-no-files-found: error

  package-deb:
    name: Package Debian (.deb)
    runs-on: ubuntu-latest
    needs: [build-release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Install cargo-deb
        run: cargo install --locked cargo-deb

      - name: Download prebuilt release package inputs
        uses: actions/download-artifact@v4
        with:
          name: release-package-inputs
          path: target

      - name: Verify tag/version consistency
        run: ./scripts/verify-tag-version.sh

      - name: Build Debian package from prebuilt inputs
        run: GIT_SYNC_USE_PREBUILT=1 ./scripts/build-deb.sh

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-deb
          path: target/debian/*.deb
          if-no-files-found: error

  package-arch:
    name: Package Arch (.pkg.tar.zst)
    runs-on: ubuntu-latest
    needs: [build-release]
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging prerequisites
        run: |
          pacman -Syu --noconfirm --needed base-devel git

      - name: Download prebuilt release package inputs
        uses: actions/download-artifact@v4
        with:
          name: release-package-inputs
          path: target

      - name: Verify tag/version consistency
        run: ./scripts/verify-tag-version.sh

      - name: Create non-root builder user
        run: |
          useradd -m builder || true
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Build Arch package from prebuilt inputs
        run: |
          su builder -c "cd '${GITHUB_WORKSPACE}' && GIT_SYNC_USE_PREBUILT=1 ./scripts/build-arch.sh"

      - name: Upload Arch package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-arch
          path: target/arch/*.pkg.tar.*
          if-no-files-found: error

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Generate docs
        run: RUSTDOCFLAGS="--html-in-header docs/mermaid-header.html" cargo doc --locked --no-deps --bins

      - name: Create root docs index for GitHub Pages
        run: |
          CRATE_DOC_DIR="$(grep -m1 '^name = ' Cargo.toml | sed -E 's/name = "([^"]+)"/\1/' | tr '-' '_')"
          if [ ! -f "target/doc/${CRATE_DOC_DIR}/index.html" ]; then
            echo "Expected crate index not found: target/doc/${CRATE_DOC_DIR}/index.html" >&2
            exit 1
          fi

          cat > target/doc/index.html <<EOF2
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta http-equiv="refresh" content="0; url=./${CRATE_DOC_DIR}/index.html" />
            <title>Redirecting to documentation…</title>
          </head>
          <body>
            <p>Redirecting to <a href="./${CRATE_DOC_DIR}/index.html">crate documentation</a>.</p>
          </body>
          </html>
          EOF2

          touch target/doc/.nojekyll

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

      - name: Archive docs for release assets
        run: tar -C target/doc -czf target/docs-html.tar.gz .

      - name: Upload docs release artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: target/docs-html.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-debug, build-release, test, package-deb, package-arch, coverage, docs]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debug binary artifact
        uses: actions/download-artifact@v4
        with:
          name: binary-debug
          path: dist/binary-debug

      - name: Download release binary artifact
        uses: actions/download-artifact@v4
        with:
          name: binary-release
          path: dist/binary-release

      - name: Download Debian package artifact
        uses: actions/download-artifact@v4
        with:
          name: package-deb
          path: dist/package-deb

      - name: Download Arch package artifact
        uses: actions/download-artifact@v4
        with:
          name: package-arch
          path: dist/package-arch

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: dist/docs-html

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: dist/coverage-lcov

      - name: Prepare release assets
        run: |
          mkdir -p dist/release-assets
          cp dist/binary-debug/git-sync dist/release-assets/git-sync-debug
          cp dist/binary-release/git-sync dist/release-assets/git-sync-release
          cp dist/package-deb/*.deb dist/release-assets/
          cp dist/package-arch/*.pkg.tar.* dist/release-assets/
          cp dist/docs-html/*.tar.gz dist/release-assets/
          cp dist/coverage-lcov/* dist/release-assets/

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          TAG_RE="$(printf '%s' "${TAG}" | sed -E 's/[][(){}.^$*+?|\\/]/\\&/g')"
          VERSION_RE="$(printf '%s' "${VERSION}" | sed -E 's/[][(){}.^$*+?|\\/]/\\&/g')"
          awk -v tag_re="${TAG_RE}" -v version_re="${VERSION_RE}" '
            BEGIN {
              capture = 0;
              match_header = "^## \\[(" tag_re "|" version_re ")\\]";
            }
            $0 ~ "^## \\[" && capture && $0 !~ match_header { exit }
            $0 ~ match_header { capture = 1 }
            capture { print }
          ' CHANGELOG.md > dist/release-notes.md

          if ! grep -q '[^[:space:]]' dist/release-notes.md; then
            echo "No CHANGELOG section found for tag ${TAG} (or ${VERSION})." >&2
            exit 1
          fi

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: dist/release-notes.md
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/release-assets/*

  deploy-pages:
    name: Deploy Docs to GitHub Pages
    needs: [build-debug, build-release, test, coverage, docs]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
