[package]
name = "git-sync-audit"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "Apache-2.0"
description = "Air-gap Git sync and audit tool"

[package.metadata.deb]
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/git-sync-audit", "usr/bin/git-sync-audit", "755"],
    ["target/man/git-sync-audit.1.gz", "usr/share/man/man1/git-sync-audit.1.gz", "644"],
    ["target/man/git-sync-audit-readme.7.gz", "usr/share/man/man7/git-sync-audit-readme.7.gz", "644"],
    ["target/man/git-sync-audit-architecture.7.gz", "usr/share/man/man7/git-sync-audit-architecture.7.gz", "644"],
    ["README.md", "usr/share/doc/git-sync-audit/README.md", "644"],
    ["SDD_SAD.md", "usr/share/doc/git-sync-audit/SDD_SAD.md", "644"],
    ["LICENSE", "usr/share/doc/git-sync-audit/LICENSE", "644"],
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2", "vendored-openssl"] }
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
openssl-sys = "0.9"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
zip = "0.6"
