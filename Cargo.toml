[package]
name = "git-sync"
version = "0.8.2"
edition = "2024"
build = "build.rs"
license = "Apache-2.0"
description = "Air-gap Git sync and audit tool"
repository = "https://github.com/daredem0/git-sync"
homepage = "https://github.com/daredem0/git-sync"
documentation = "https://daredem0.github.io/git-sync/"

[package.metadata.deb]
maintainer = "f.leuze@outlook.de"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/git-sync", "usr/bin/git-sync", "755"],
    ["target/man/git-sync.1.gz", "usr/share/man/man1/git-sync.1.gz", "644"],
    ["target/man/git-sync-readme.7.gz", "usr/share/man/man7/git-sync-readme.7.gz", "644"],
    ["target/man/git-sync-architecture.7.gz", "usr/share/man/man7/git-sync-architecture.7.gz", "644"],
    ["README.md", "usr/share/doc/git-sync/README.md", "644"],
    ["docs/SDD_SAD.md", "usr/share/doc/git-sync/SDD_SAD.md", "644"],
    ["LICENSE", "usr/share/doc/git-sync/LICENSE", "644"],
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2", "vendored-openssl"] }
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
openssl-sys = { version = "0.9", features = ["vendored"] }
flate2 = "1.0"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
time = "0.3"
zip = "0.6"
