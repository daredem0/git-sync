<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  function convertRustdocMermaidBlocks() {
    const blocks = document.querySelectorAll("pre.language-mermaid");
    for (const pre of blocks) {
      const code = pre.querySelector("code");
      const source = code ? code.textContent : pre.textContent;
      if (!source) continue;

      const container = document.createElement("div");
      container.className = "mermaid";
      container.textContent = source.trim();
      pre.replaceWith(container);
    }
  }

  window.addEventListener("DOMContentLoaded", async () => {
    convertRustdocMermaidBlocks();
    mermaid.initialize({ startOnLoad: false, securityLevel: "loose" });
    await mermaid.run({ querySelector: ".mermaid" });
  });
</script>
